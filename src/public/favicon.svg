<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo escuro com gradiente -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1422"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>

    <!-- Gradiente Verde/Teal do Shaka -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee7d8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#17a895"/>
    </linearGradient>

    <!-- Sombra/Glow verde no fundo do S -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#2dd4bf" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base com cantos arredondados -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#2dd4bf" stroke-opacity="0.15" stroke-width="8"/>

  <!-- Letra S estilizada com efeito de onda nas pontas -->
  <path d="M 340 160 
           C 340 120, 290 100, 240 100 
           C 170 100, 150 145, 150 185 
           C 150 250, 350 240, 350 325 
           C 350 380, 310 412, 240 412 
           C 175 412, 140 375, 140 335" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="54" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Detalhe de luz (ponto reluzente) -->
  <circle cx="340" cy="160" r="12" fill="#ffffff" opacity="0.9"/>
</svg>
